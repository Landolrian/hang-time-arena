<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Clip contact sheet</title>
<style>
  html, body { margin: 0; background: #1a1720; overflow: hidden; }
  #labels { position: fixed; inset: 0; pointer-events: none; font: 600 12px/1 system-ui, sans-serif; color: #e9edf2; }
  #labels div { position: absolute; padding: 4px; }
</style>
</head>
<body>
<div id="labels"></div>
<script type="module">
// Renders clips on the contestant as a grid of frames (one clip per row), for judging sources.
import * as THREE from "three";
import { loadClips } from "/src/anim/library.js";
import { makeContestant, setVariant, TEAMS } from "/src/looktest/contestant.js";
import { shared } from "/src/looktest/toon.js";

shared.styleB.value = 1;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setScissorTest(true);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2633);
scene.add(new THREE.HemisphereLight(0xffffff, 0x555560, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(4, 10, 6);
scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshLambertMaterial({ color: 0x8a8f96 }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
const grid = new THREE.GridHelper(60, 120, 0x5b6068, 0x5b6068);
grid.position.y = 0.002;
scene.add(grid);
const base = "/assets/looktest/chars/ubc/";
const model = await makeContestant({ body: `${base}Superhero_Male_FullBody.gltf`, skin: `${base}T_Superhero_Male_Ligh.png`, team: TEAMS.red, number: 7, variant: "final", tweaks: {} });
setVariant(model, "final");
scene.add(model);
const clips = await loadClips();
const mixer = new THREE.AnimationMixer(model.children[0]);
const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 100);
window.clipNames = clips.map((c) => `${c.name} ${c.duration.toFixed(2)}`);
// rows: clip names; cols: frames per clip; view: side | front | back | three
window.sheet = (names, cols = 6, view = "side", span = 1) => {
  const labels = document.querySelector("#labels");
  labels.innerHTML = "";
  const rows = names.length, w = innerWidth / cols, h = innerHeight / rows;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  names.forEach((name, r) => {
    const clip = clips.find((c) => c.name === name);
    mixer.stopAllAction();
    const action = mixer.clipAction(clip);
    action.play();
    for (let c = 0; c < cols; c++) {
      const t = clip.duration * span * c / Math.max(1, cols - (span === 1 ? 1 : 0));
      mixer.setTime(t);
      model.updateMatrixWorld(true);
      const pelvis = model.userData.bones.pelvis.getWorldPosition(new THREE.Vector3());
      const at = new THREE.Vector3(0, Math.max(0.5, pelvis.y * 0.9), pelvis.z);
      const dir = { side: [1, 0.15, 0], front: [0, 0.15, 1], back: [0, 0.25, -1], three: [0.8, 0.35, 0.8] }[view];
      camera.position.copy(at).add(new THREE.Vector3(...dir).normalize().multiplyScalar(4.4 * Math.max(1, 0.55 + rows * 0.0)));
      camera.lookAt(at);
      const x = c * w, y = innerHeight - (r + 1) * h;
      renderer.setViewport(x, y, w, h);
      renderer.setScissor(x, y, w, h);
      renderer.render(scene, camera);
      const label = document.createElement("div");
      label.style.left = `${x}px`; label.style.top = `${r * h}px`;
      label.textContent = `${name} t=${t.toFixed(2)}`;
      labels.append(label);
    }
  });
  return true;
};
window.ready = true;
</script>
</body>
</html>
